# Offer the local WARP relay as an egress path.
#
# The path is chosen per request by zen-proxy, not by the process environment:
# a process-wide HTTPS_PROXY pins every call to one exit, and a refused exit
# then takes the whole install down (measured: the WARP exit answered
# `429 FreeUsageLimitError` while the host's own address answered 200 for
# twelve requests in a row). So this drop-in only declares the hop; with
# `WARP_PROXY_MODE=auto` the proxy starts direct and switches to the hop when
# direct is refused (and back).
#
# `always` pins the hop, `off` never uses it. The relay
# (zen-proxy-warp-relay.service) falls back to a direct socket when WARP itself
# is down, so a stopped warp-svc still leaves the proxy usable.
#
# Install as /etc/systemd/system/zen-proxy.service.d/warp-proxy.conf
[Service]
Environment=WARP_PROXY_HOP=http://127.0.0.1:40000
Environment=WARP_PROXY_MODE=auto
