# Route every upstream call through the local WARP relay.
#
# Node reads NODE_USE_ENV_PROXY / HTTPS_PROXY when the process starts, so this
# drop-in is the only place that can turn the hop on. The relay
# (zen-proxy-warp-relay.service) falls back to a direct socket when WARP is
# down, so a stopped warp-svc does not take the upstream with it.
#
# Install as /etc/systemd/system/zen-proxy.service.d/warp-proxy.conf
[Service]
Environment=NODE_USE_ENV_PROXY=1
Environment=HTTPS_PROXY=http://127.0.0.1:8890
Environment=HTTP_PROXY=http://127.0.0.1:8890
Environment=NO_PROXY=127.0.0.1,localhost,::1
